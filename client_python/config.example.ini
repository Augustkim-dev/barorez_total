; barorez-printer 설정 예시
; 실사용 시 이 파일을 config.ini 로 복사한 뒤 값을 수정.
; D013 부터 [server] / [client] 섹션이 추가될 예정.

[printer]
; Windows '제어판 > 장치 및 프린터' 에 표시되는 정확한 프린터 이름.
; tools/list_printers.py 로 설치된 프린터 목록 확인 가능.
name = BIXOLON SRP-330II

; 한글 코드페이지. 국내 ESC/POS 모델은 대부분 CP949 지원.
; 일부 펌웨어는 EUC-KR 만 지원 — 한글 깨짐 시 euc-kr 로 변경.
codepage = cp949

; 영수증 폭 (컬럼 수). 80mm = 48, 58mm = 32.
width = 48

; ESC/POS 코드페이지 선택 명령에 들어가는 펌웨어 측 코드페이지 번호.
; CP949 (한글, EPSON 계열 일반) 는 보통 13 또는 22. 빈 값이면 명령 생략.
escpos_codepage_id =
