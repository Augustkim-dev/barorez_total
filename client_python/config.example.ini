; barorez-printer 설정 예시
; 실사용 시 이 파일을 config.ini 로 복사한 뒤 값을 수정.

[server]
; Server C WebSocket 엔드포인트. 운영: wss://barorez.com/printsvc/ws
ws_url = wss://barorez.com/printsvc/ws

; PHP API 베이스 URL (현재는 토큰 발급 CLI 에서만 사용)
http_base = https://barorez.com

[client]
; tools/register_client.py 로 발급받은 값을 그대로 입력.
client_idx = 0
token =

; 본 PC 가 담당할 capability 목록. kitchen / counter / bar 중 하나 이상,
; 콤마 구분. Server C 는 매장 DB 의 capability 와 교집합만 사용.
capabilities = kitchen

; 매장 메타 정보 — 본부 운영자가 어느 매장 PC 인지 식별하는 용도.
; 서버에는 전송되지 않고 로컬 로그와 트레이 툴팁에만 표시됨.
; 매장 식별은 client_idx+token 으로 서버에서 결정됨.
shop_idx = 0
shop_name =

; 임의 식별용 버전 문자열 — Server C 로그에 기록됨.
app_version = 0.1.0-d016

[printer]
; Windows '제어판 > 장치 및 프린터' 에 표시되는 정확한 프린터 이름.
; tools/list_printers.py 로 설치된 프린터 목록 확인 가능.
name = BIXOLON SRP-330II

; 한글 코드페이지. 국내 ESC/POS 모델은 대부분 CP949 지원.
; 일부 펌웨어는 EUC-KR 만 지원 — 한글 깨짐 시 euc-kr 로 변경.
codepage = cp949

; 영수증 폭 (컬럼 수). 80mm = 48, 58mm = 32.
width = 48

; ESC/POS 코드페이지 선택 명령에 들어가는 펌웨어 측 코드페이지 번호.
; CP949 (한글, EPSON 계열 일반) 는 보통 13 또는 22. 빈 값이면 명령 생략.
escpos_codepage_id =

; 우측 여백 (컬럼 단위). 모든 라인의 유효 폭 = width - right_margin.
; 0 이면 폭 끝까지 출력 — 영수증 우측이 너무 빽빽하면 2 권장 (기본).
right_margin = 2
