# =============================================================
# Apache 리버스 프록시 설정 — Server C 외부 노출
# Phase 2 D011 / PRD §4.2
# =============================================================
#
# 적용 위치: 운영 서버의 barorez.com vhost (보통 /etc/apache2/sites-available/ 또는
#            /etc/httpd/conf.d/ 하위). 본 파일을 vhost 의 <VirtualHost *:443> 블록 안에 Include.
#
# 사전 조건 (운영 서버에서 1회 수행):
#   a2enmod proxy proxy_http proxy_wstunnel    # Debian/Ubuntu
#   또는 LoadModule proxy_module / proxy_http_module / proxy_wstunnel_module  # RHEL/CentOS
#   apachectl configtest && systemctl reload apache2
#
# 가용성 확인:
#   apachectl -M | grep -E "proxy_wstunnel|proxy_http"
#
# Webhook 은 PHP 가 동일 호스트의 127.0.0.1:3000 으로 직접 호출 (이 프록시 우회).
# 외부에 노출되는 것은 /printsvc/ws (매장 PC) 와 /printsvc/health (모니터링) 정도.
#
# 보안:
#   - /printsvc/health 는 IP whitelist 가 권장 (예시는 본 파일 하단 참고)
#   - /printsvc/webhook/print 는 외부 노출 불필요 — 명시적 차단
# =============================================================

# WebSocket Upgrade 헤더가 있을 때 ws:// 로 라우팅
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteCond %{REQUEST_URI}  ^/printsvc/ws$ [NC]
RewriteRule .* ws://127.0.0.1:3000%{REQUEST_URI} [P,L]

# 일반 HTTP 프록시 (헬스체크 등)
ProxyPass        /printsvc/ws        ws://127.0.0.1:3000/ws
ProxyPassReverse /printsvc/ws        ws://127.0.0.1:3000/ws

ProxyPass        /printsvc/health    http://127.0.0.1:3000/health
ProxyPassReverse /printsvc/health    http://127.0.0.1:3000/health

# Webhook 은 외부 노출하지 않음 (PHP 는 127.0.0.1 직접 호출)
<Location /printsvc/webhook>
    Require all denied
</Location>

# 헬스체크는 모니터링 도구 IP 만 (선택, 운영 환경에 맞게 조정)
# <Location /printsvc/health>
#     Require ip 10.0.0.0/8
#     Require ip 127.0.0.1
# </Location>

# Server C 의 루트는 외부 노출 불필요
<Location /printsvc/>
    # 위에서 명시되지 않은 모든 경로는 prefix 매칭 안 됨 (Apache 기본 동작) — 추가 보호 불필요.
</Location>

# =============================================================
# 적용 후 검증 (외부에서):
#   curl -sS https://barorez.com/printsvc/health
#   wscat -c wss://barorez.com/printsvc/ws    # 인증 미발송 → 5초 후 close 4001
# =============================================================
